<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Our Chickens — Collins Creek Farms</title>
  <meta name="description" content="Meet the flock at Collins Creek Farms — free-range chickens led by The Colonel." />
  <link rel="canonical" href="https://collinscreekfarms.com/chickens/" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Collins Creek Farms" />
  <meta property="og:title" content="Our Chickens — Collins Creek Farms" />
  <meta property="og:description" content="Meet the flock at Collins Creek Farms." />
  <meta property="og:url" content="https://collinscreekfarms.com/chickens/" />
  <meta property="og:image" content="https://collinscreekfarms.com/assets/images/chickens/roosters/colonel.jpg" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="icon" href="/assets/images/logo.ico" type="image/x-icon" />
  <link rel="stylesheet" href="/assets/css/main.css" />
</head>
<body>
  <header class="site-header"></header>

  <main>
    <section class="page-hero">
      <div class="wrap">
        <span class="eyebrow">The Flock</span>
        <h1>Our chickens.</h1>
        <p class="lede">Free-range hens and one rooster who runs a tight ship.</p>
      </div>
    </section>

    <section class="section section--bone" data-animal-section>
      <div class="wrap">
        <div class="filters">
          <button class="filter-btn" data-filter="all">All</button>
          <button class="filter-btn" data-filter="rooster">Rooster</button>
          <button class="filter-btn" data-filter="hen">Hens</button>
          <button class="filter-btn" data-filter="chick">Chicks</button>
        </div>
        <div class="animal-grid" data-animal-grid data-species="chicken" data-default-filter="all"></div>
      </div>
    </section>

    <section class="section section--dark">
      <div class="wrap">
        <div class="section__head">
          <span class="eyebrow">Snapshots</span>
          <span class="rule"></span>
          <h2>Life in the coop.</h2>
          <p class="lede" style="margin-top: 1rem;">The girls (and one very proud rooster), out and about on the farm. Click any photo to see it full-size.</p>
        </div>
        <div class="photo-gallery">
          <div class="photo-gallery__item" data-lightbox>
            <img src="/assets/images/gallery/chickens/flock-01.jpg" alt="Hens free-ranging on the farm" loading="lazy" />
          </div>
          <div class="photo-gallery__item" data-lightbox>
            <img src="/assets/images/gallery/chickens/flock-02.jpg" alt="Hens free-ranging on the farm" loading="lazy" />
          </div>
          <div class="photo-gallery__item" data-lightbox>
            <img src="/assets/images/gallery/chickens/flock-03.jpg" alt="The flock's coop at Collins Creek Farms" loading="lazy" />
          </div>
          <div class="photo-gallery__item" data-lightbox>
            <img src="/assets/images/gallery/chickens/flock-05.jpg" alt="A hen up close" loading="lazy" />
          </div>
          <div class="photo-gallery__item" data-lightbox>
            <img src="/assets/images/gallery/chickens/flock-06.jpg" alt="A small group of hens up close" loading="lazy" />
          </div>
          <div class="photo-gallery__item" data-lightbox>
            <img src="/assets/images/gallery/chickens/flock-07.jpg" alt="Hens free-ranging on the farm" loading="lazy" />
          </div>
          <div class="photo-gallery__item" data-lightbox>
            <img src="/assets/images/gallery/chickens/flock-08.jpg" alt="Chicks in the brooder" loading="lazy" />
          </div>
          <div class="photo-gallery__item" data-lightbox>
            <img src="/assets/images/gallery/chickens/flock-09.jpg" alt="The flock's coop at Collins Creek Farms" loading="lazy" />
          </div>
          <div class="photo-gallery__item" data-lightbox>
            <img src="/assets/images/gallery/chickens/flock-10.jpg" alt="Hens free-ranging on the farm" loading="lazy" />
          </div>
          <div class="photo-gallery__item" data-lightbox>
            <img src="/assets/images/gallery/chickens/flock-11.jpg" alt="A hen close portrait" loading="lazy" />
          </div>
          <div class="photo-gallery__item" data-lightbox>
            <img src="/assets/images/gallery/chickens/flock-12.jpg" alt="Hens free-ranging on the farm" loading="lazy" />
          </div>
          <div class="photo-gallery__item" data-lightbox>
            <img src="/assets/images/gallery/chickens/flock-13.jpg" alt="Chicks in the brooder" loading="lazy" />
          </div>
          <div class="photo-gallery__item" data-lightbox>
            <img src="/assets/images/gallery/chickens/flock-14.jpg" alt="The flock foraging" loading="lazy" />
          </div>
          <div class="photo-gallery__item" data-lightbox>
            <img src="/assets/images/gallery/chickens/flock-16.jpg" alt="A hen close portrait" loading="lazy" />
          </div>
          <div class="photo-gallery__item" data-lightbox>
            <img src="/assets/images/gallery/chickens/flock-17.jpg" alt="Hens free-ranging on the farm" loading="lazy" />
          </div>
          <div class="photo-gallery__item" data-lightbox>
            <img src="/assets/images/gallery/chickens/flock-18.jpg" alt="The flock's coop at Collins Creek Farms" loading="lazy" />
          </div>
        </div>
      </div>
    </section>
  </main>

  <div class="lightbox" aria-hidden="true">
    <button class="lightbox__btn lightbox__close" aria-label="Close">&times;</button>
    <button class="lightbox__btn lightbox__prev" aria-label="Previous">&#10094;</button>
    <img class="lightbox__img" src="" alt="" />
    <button class="lightbox__btn lightbox__next" aria-label="Next">&#10095;</button>
    <div class="lightbox__caption"></div>
  </div>

  <footer class="site-footer"></footer>
  <script src="/assets/js/main.js"></script>
</body>
</html>
