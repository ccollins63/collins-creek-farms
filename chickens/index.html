<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Our Chickens — Collins Creek Farms</title>
  <meta name="description" content="Meet the flock at Collins Creek Farms — free-range chickens led by The Colonel." />
  <link rel="canonical" href="https://collinscreekfarms.com/chickens/" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Collins Creek Farms" />
  <meta property="og:title" content="Our Chickens — Collins Creek Farms" />
  <meta property="og:description" content="Meet the flock at Collins Creek Farms." />
  <meta property="og:url" content="https://collinscreekfarms.com/chickens/" />
  <meta property="og:image" content="https://collinscreekfarms.com/assets/images/chickens/roosters/colonel.jpg" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="icon" href="/assets/images/logo.ico" type="image/x-icon" />
  <link rel="stylesheet" href="/assets/css/main.css" />
</head>
<body>
  <header class="site-header"></header>

  <main>
    <section class="page-hero">
      <div class="wrap">
        <span class="eyebrow">The Flock</span>
        <h1>Our chickens.</h1>
        <p class="lede">Free-range hens and one rooster who runs a tight ship.</p>
      </div>
    </section>

    <section class="section section--bone" data-animal-section>
      <div class="wrap">
        <div class="filters">
          <button class="filter-btn" data-filter="all">All</button>
          <button class="filter-btn" data-filter="rooster">Rooster</button>
          <button class="filter-btn" data-filter="hen">Hens</button>
          <button class="filter-btn" data-filter="chick">Chicks</button>
        </div>
        <div class="animal-grid" data-animal-grid data-species="chicken" data-default-filter="all"></div>
      </div>
    </section>

    <section class="section section--dark">
      <div class="wrap">
        <div class="section__head">
          <span class="eyebrow">Snapshots</span>
          <span class="rule"></span>
          <h2>Life in the coop.</h2>
          <p class="lede" style="margin-top: 1rem;">A few recent shots of the flock. Click any photo to see it full-size.</p>
        </div>
        <div class="photo-gallery">
          <div class="photo-gallery__item" data-lightbox>
            <img src="/assets/images/gallery/chickens/2025-04-27_154011.jpg" alt="Hens in the run" loading="lazy" />
          </div>
          <div class="photo-gallery__item" data-lightbox>
            <img src="/assets/images/gallery/chickens/2025-06-11_212251.jpg" alt="A hen out in the yard" loading="lazy" />
          </div>
          <div class="photo-gallery__item" data-lightbox>
            <img src="/assets/images/gallery/chickens/2025-10-01_174531.jpg" alt="The flock foraging" loading="lazy" />
          </div>
          <div class="photo-gallery__item" data-lightbox>
            <img src="/assets/images/gallery/chickens/2025-10-07_155259.jpg" alt="Hens near the coop" loading="lazy" />
          </div>
          <div class="photo-gallery__item" data-lightbox>
            <img src="/assets/images/gallery/chickens/2025-11-10_122225.jpg" alt="A hen close up" loading="lazy" />
          </div>
          <div class="photo-gallery__item" data-lightbox>
            <img src="/assets/images/gallery/chickens/2025-11-15_131904.jpg" alt="The flock in the run" loading="lazy" />
          </div>
          <div class="photo-gallery__item" data-lightbox>
            <img src="/assets/images/gallery/chickens/2026-01-23_161037.jpg" alt="Hens scratching in the yard" loading="lazy" />
          </div>
          <div class="photo-gallery__item" data-lightbox>
            <img src="/assets/images/gallery/chickens/2026-04-12_151156.jpg" alt="A hen in the spring grass" loading="lazy" />
          </div>
          <div class="photo-gallery__item" data-lightbox>
            <img src="/assets/images/gallery/chickens/2026-07-27_105210.jpg" alt="The flock on a summer afternoon" loading="lazy" />
          </div>
          <div class="photo-gallery__item" data-lightbox>
            <img src="/assets/images/gallery/chickens/2026-09-02_134242.jpg" alt="A hen near the coop fencing" loading="lazy" />
          </div>
        </div>
      </div>
    </section>
  </main>

  <div class="lightbox" aria-hidden="true">
    <button class="lightbox__btn lightbox__close" aria-label="Close">&times;</button>
    <button class="lightbox__btn lightbox__prev" aria-label="Previous">&#10094;</button>
    <img class="lightbox__img" src="" alt="" />
    <button class="lightbox__btn lightbox__next" aria-label="Next">&#10095;</button>
    <div class="lightbox__caption"></div>
  </div>

  <footer class="site-footer"></footer>
  <script src="/assets/js/main.js"></script>
</body>
</html>
