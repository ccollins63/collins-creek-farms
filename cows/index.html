<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Our Cattle — Collins Creek Farms</title>
  <meta name="description" content="Meet the cattle of Collins Creek Farms — bull, cows, and calves raised on pasture in Cumming, Georgia." />
  <link rel="canonical" href="https://collinscreekfarms.com/cows/" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Collins Creek Farms" />
  <meta property="og:title" content="Our Cattle — Collins Creek Farms" />
  <meta property="og:description" content="Meet the cattle of Collins Creek Farms." />
  <meta property="og:url" content="https://collinscreekfarms.com/cows/" />
  <meta property="og:image" content="https://collinscreekfarms.com/assets/images/cattle/bulls/bigmac.jpg" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="icon" href="/assets/images/logo.ico" type="image/x-icon" />
  <link rel="stylesheet" href="/assets/css/main.css" />
</head>
<body>
  <header class="site-header"></header>

  <main>
    <section class="page-hero">
      <div class="wrap">
        <span class="eyebrow">The Cattle</span>
        <h1>Our cattle.</h1>
        <p class="lede">A small herd raised on Georgia pasture. Every one of them has a name.</p>
      </div>
    </section>

    <section class="section section--bone" data-animal-section>
      <div class="wrap">
        <div class="filters">
          <button class="filter-btn" data-filter="all">All</button>
          <button class="filter-btn" data-filter="bull">Bull</button>
          <button class="filter-btn" data-filter="cow">Cows</button>
          <button class="filter-btn" data-filter="calf">Calves</button>
        </div>
        <div class="animal-grid" data-animal-grid data-species="cattle" data-default-filter="all"></div>
      </div>
    </section>

    <section class="section section--dark">
      <div class="wrap">
        <div class="section__head">
          <span class="eyebrow">Snapshots</span>
          <span class="rule"></span>
          <h2>Life in the pasture.</h2>
          <p class="lede" style="margin-top: 1rem;">A few recent shots of the herd. Click any photo to see it full-size.</p>
        </div>
        <div class="photo-gallery">
          <div class="photo-gallery__item" data-lightbox data-name="">
            <img src="/assets/images/gallery/cattle/2025-01-25_131229.jpg" alt="The herd on a winter morning" loading="lazy" />
          </div>
          <div class="photo-gallery__item" data-lightbox data-name="Eleanor">
            <img src="/assets/images/gallery/cattle/2025-05-16_111331.jpg" alt="Eleanor grazing in the pasture" loading="lazy" />
          </div>
          <div class="photo-gallery__item" data-lightbox data-name="Annabelle">
            <img src="/assets/images/gallery/cattle/2025-06-02_200323.jpg" alt="Annabelle in the evening light" loading="lazy" />
          </div>
          <div class="photo-gallery__item" data-lightbox data-name="Hazel">
            <img src="/assets/images/gallery/cattle/2025-06-13_204014.jpg" alt="Hazel out on pasture at dusk" loading="lazy" />
          </div>
          <div class="photo-gallery__item" data-lightbox data-name="Myrtle">
            <img src="/assets/images/gallery/cattle/2025-08-27_174312.jpg" alt="Myrtle grazing" loading="lazy" />
          </div>
          <div class="photo-gallery__item" data-lightbox data-name="">
            <img src="/assets/images/gallery/cattle/2025-10-08_190503.jpg" alt="The herd grazing together" loading="lazy" />
          </div>
          <div class="photo-gallery__item" data-lightbox data-name="">
            <img src="/assets/images/gallery/cattle/2025-11-28_130611.jpg" alt="The herd out on fall pasture" loading="lazy" />
          </div>
          <div class="photo-gallery__item" data-lightbox data-name="">
            <img src="/assets/images/gallery/cattle/2026-01-07_084634.jpg" alt="A spring calf, tag P02-1" loading="lazy" />
          </div>
          <div class="photo-gallery__item" data-lightbox data-name="Myrtle">
            <img src="/assets/images/gallery/cattle/2026-02-16_180539.jpg" alt="Myrtle in late winter" loading="lazy" />
          </div>
          <div class="photo-gallery__item" data-lightbox data-name="Lucille">
            <img src="/assets/images/gallery/cattle/2026-05-12_171938.jpg" alt="Lucille grazing" loading="lazy" />
          </div>
          <div class="photo-gallery__item" data-lightbox data-name="">
            <img src="/assets/images/gallery/cattle/2026-07-21_195705.jpg" alt="The herd at sunset" loading="lazy" />
          </div>
          <div class="photo-gallery__item" data-lightbox data-name="Blanche">
            <img src="/assets/images/gallery/cattle/2026-09-09_170127.jpg" alt="Blanche in the pasture" loading="lazy" />
          </div>
        </div>
      </div>
    </section>
  </main>

  <div class="lightbox" aria-hidden="true">
    <button class="lightbox__btn lightbox__close" aria-label="Close">&times;</button>
    <button class="lightbox__btn lightbox__prev" aria-label="Previous">&#10094;</button>
    <img class="lightbox__img" src="" alt="" />
    <button class="lightbox__btn lightbox__next" aria-label="Next">&#10095;</button>
    <div class="lightbox__caption"></div>
  </div>

  <footer class="site-footer"></footer>
  <script src="/assets/js/main.js"></script>
</body>
</html>
