<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Our Cattle — Collins Creek Farms</title>
  <meta name="description" content="Meet the cattle of Collins Creek Farms — bull, cows, and calves raised on pasture in Cumming, Georgia." />
  <link rel="canonical" href="https://collinscreekfarms.com/cows/" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Collins Creek Farms" />
  <meta property="og:title" content="Our Cattle — Collins Creek Farms" />
  <meta property="og:description" content="Meet the cattle of Collins Creek Farms." />

  <link rel="stylesheet" href="/assets/css/main.css" />

<body>
  <header class="site-header"></header>

  <main>
    <section class="page-hero">
      <div class="wrap">
        <span class="eyebrow">The Cattle</span>
        <h1>Our cattle.</h1>
        <p class="lede">A small herd raised on Georgia pasture. Every one of them has a name.</p>
      </div>
    </section>

    <section class="section section--bone" data-animal-section>
      <div class="wrap">
        <div class="filters">
          <button class="filter-btn" data-filter="all">All</button>
          <button class="filter-btn" data-filter="bull">Bull</button>
          <button class="filter-btn" data-filter="cow">Cows</button>

        </div>
        <div class="animal-grid" data-animal-grid data-species="cattle" data-default-filter="all"></div>
      </div>
    </section>
  </main>

  <div class="lightbox" aria-hidden="true">
    <button class="lightbox__btn lightbox__close" aria-label="Close">&times;</button>
    <button class="lightbox__btn lightbox__prev" aria-label="Previous">&#10094;</button>
    <img class="lightbox__img" src="" alt="" />
    <button class="lightbox__btn lightbox__next" aria-label="Next">&#10095;</button>
    <div class="lightbox__caption"></div>

  <footer class="site-footer"></footer>
  <script src="/assets/js/main.js"></script>
