<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Herd — Collins Creek Farms</title>
  <meta name="description" content="Meet every animal at Collins Creek Farms — cattle, chickens, and calves." />
  <link rel="canonical" href="https://collinscreekfarms.com/animals/" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Collins Creek Farms" />
  <meta property="og:title" content="The Herd — Collins Creek Farms" />
  <meta property="og:description" content="Meet every animal at Collins Creek Farms." />
  <meta property="og:url" content="https://collinscreekfarms.com/animals/" />
  <meta property="og:image" content="https://collinscreekfarms.com/assets/images/cattle/bulls/bigmac.jpg" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="icon" href="/assets/images/logo.ico" type="image/x-icon" />
  <link rel="stylesheet" href="/assets/css/main.css" />
</head>
<body>
  <header class="site-header"></header>

  <main>
    <section class="page-hero">
      <div class="wrap">
        <span class="eyebrow">The Herd</span>
        <h1>Meet the animals.</h1>
        <p class="lede">Every name. Every face. Click a portrait to see it full-size.</p>
      </div>
    </section>

    <section class="section section--bone" data-animal-section>
      <div class="wrap">
        <div class="filters">
          <button class="filter-btn" data-filter="all">All</button>
          <button class="filter-btn" data-filter="bull">Bull</button>
          <button class="filter-btn" data-filter="cow">Cows</button>
          <button class="filter-btn" data-filter="calf">Calves</button>
          <button class="filter-btn" data-filter="rooster">Rooster</button>
          <button class="filter-btn" data-filter="hen">Hens</button>
          <button class="filter-btn" data-filter="chick">Chicks</button>
        </div>
        <div class="animal-grid" data-animal-grid data-species="all" data-default-filter="all"></div>
      </div>
    </section>
  </main>

  <div class="lightbox" aria-hidden="true">
    <button class="lightbox__btn lightbox__close" aria-label="Close">&times;</button>
    <button class="lightbox__btn lightbox__prev" aria-label="Previous">&#10094;</button>
    <img class="lightbox__img" src="" alt="" />
    <button class="lightbox__btn lightbox__next" aria-label="Next">&#10095;</button>
    <div class="lightbox__caption"></div>
  </div>

  <footer class="site-footer"></footer>
  <script src="/assets/js/main.js"></script>
</body>
</html>
